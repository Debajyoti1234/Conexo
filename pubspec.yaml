name: conexo
description: "Conexo - Meet, Connect & Explore"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Flutter Icons
  cupertino_icons: ^1.0.8

  # Fonts
  google_fonts: ^6.3.0

  # Animations
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.1

  # Routing
  

  # State Management
  flutter_riverpod: ^2.6.1

  # Local preferences (Connections dashboard expansion state)
  shared_preferences: ^2.3.2
  firebase_core: ^4.13.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/auth/
    - assets/images/portraits/
    - assets/images/plans/
    - assets/icons/

    - assets/logo/
    - assets/animations/



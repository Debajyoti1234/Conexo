name: conexo
description: "Conexo - Meet, Connect & Explore"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Flutter Icons
  cupertino_icons: ^1.0.8

  # Fonts
  google_fonts: ^6.3.0

  # Animations
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.1

  # Routing
  

  # State Management
  flutter_riverpod: ^2.6.1

  # Local preferences (Connections dashboard expansion state)
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.17.1
  google_sign_in: ^7.2.0

  # Permissions
  permission_handler: ^11.3.0

  # Image picking
  image_picker: ^1.1.2

  # Image normalization (JPEG canonical format for uploads/verification)
  flutter_image_compress: ^2.0.0

  # Lightweight vector icons for the verification flow (pure-Dart, no native plugin)
  flutter_svg: ^2.0.17

  # HTTP client for backend integration
  http: ^1.2.2

  # URL launcher for support mailto links
  url_launcher: ^6.3.0

  # App version information
  package_info_plus: ^10.2.1

  # Location (GPS coordinates + reverse geocoding for readable area name)
  geolocator: ^14.0.3
  geocoding: ^5.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/auth/
    - assets/images/portraits/
    - assets/images/plans/
    - assets/icons/
    - assets/logo/
    - assets/animations/
    - assets/verification/


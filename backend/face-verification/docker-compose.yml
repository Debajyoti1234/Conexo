# docker-compose.yml — Production deployment for Conexo Face Verification
#
# Prerequisites: Docker Engine + Docker Compose
# HTTPS is terminated automatically by Caddy (Let's Encrypt).
#
# Usage:
#   1. Copy .env.example to .env and fill in real values:
#      cp .env.example .env
#   2. Edit Caddyfile: replace {your-domain.example.com} with your real domain
#   3. docker compose up -d
#   4. Check health: curl https://your-domain.example.com/health
#
# The FastAPI container listens on an internal-only network (never exposed
# directly to the public internet). Caddy is the only public-facing service.

services:
  face-verification:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - face-verification
    networks:
      - backend

networks:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config:
